<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GatorBait Media</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--navy); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper); }
  .art { position: absolute; top: 0; left: 480px; width: 480px; height: 288px; overflow: hidden; }
  .art svg { display: block; width: 480px; height: 288px; }
  .navy { fill: var(--navy); }
  .stone { fill: var(--stone); }
  .blue { fill: var(--gator-blue); }
  .gorange { fill: var(--gator-orange); }
  .orange { fill: var(--orange); }
  .hair { fill: var(--rule); }
  .sq { rx: var(--radius-0); }
  .words { position: absolute; left: var(--space-24); bottom: var(--space-24); max-width: 440px; }
  .name { margin: 0; font-size: 80px; line-height: .92; font-weight: 800; letter-spacing: -.025em; color: var(--navy); }
  .tag { margin: var(--space-12) 0 0 3px; font: 400 14px/20px var(--font-copy); color: var(--slate); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 480 288" width="480" height="288">
<!--
  blocks      navy 264×272 bled off the top and right (the ink and the Magazine panel, the biggest) · stone 176×144 (the voices band tint) · gator-blue 120×72 · gator-orange 40×72 (the mobile shell's signal), together ≈38% of 960×288
  arrangement the front page's own grid: a main column (blue, gator-orange, stone) beside a rail slab of navy, bottoms on one line space-24 above the edge, space-24 gutter
  pattern     rules, from "organized by rules instead of cards and shadows": one border-3 navy rule over the column (the section nav's top), one border-4 orange rule opening the stone module (a section title), one border-4 orange rule across the navy slab (the Magazine panel's top), three border-1 rule hairlines in the stone (the wire list) — six rules
  scales      sides on space-24/space-12 steps; gutter space-24; hairline pitch space-32; corners radius-0; rule weights border-1, border-3, border-4
-->
<rect class="blue sq" x="24" y="24" width="120" height="72"/>
<rect class="gorange sq" x="160" y="24" width="40" height="72"/>
<rect class="navy sq" x="24" y="8" width="176" height="3"/>
<rect class="orange sq" x="24" y="108" width="176" height="4"/>
<rect class="stone sq" x="24" y="120" width="176" height="144"/>
<rect class="hair sq" x="24" y="168" width="176" height="1"/>
<rect class="hair sq" x="24" y="200" width="176" height="1"/>
<rect class="hair sq" x="24" y="232" width="176" height="1"/>
<rect class="navy sq" x="224" y="-8" width="264" height="272"/>
<rect class="orange sq" x="224" y="36" width="264" height="4"/>
</svg>
</div>
<div class="words">
<h1 class="name">GatorBait<br>Media</h1>
<p class="tag">Independent voices. Unmistakably GatorBait.</p>
</div>
</div>
</body>
</html>
