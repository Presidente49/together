<!-- @dsCard height=288 -->
<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>GatorBait Media</title>
<link rel="stylesheet" href="../../tokens.css">
<style>
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); font-family: var(--font-display); overflow: hidden; }
  .cover { position: relative; width: 960px; height: 288px; overflow: hidden; background: var(--paper); }
  .art { position: absolute; top: 0; left: 0; width: 960px; height: 288px; }
  .art svg { display: block; width: 960px; height: 288px; }
  .blue { fill: var(--gator-blue); }
  .orange { fill: var(--orange); }
  .oink { fill: var(--orange-ink); }
  .hub { fill: var(--hub); }
  .chip { fill: var(--chip); }
  .rule { fill: var(--rule); }
  .sq { rx: var(--radius-0); }
  .words { position: absolute; left: var(--space-24); bottom: var(--space-24); }
  .name { margin: 0; font-size: 72px; line-height: .9; font-weight: 800; letter-spacing: -.01em; text-transform: uppercase; color: var(--ink); }
  .name span { color: var(--link); }
  .tag { margin: var(--space-10) 0 0 3px; font: 700 14px/20px var(--font-display); letter-spacing: .14em; text-transform: uppercase; color: var(--ink-2); }
</style>
</head>
<body>
<div class="cover">
<div class="art" aria-hidden="true">
<svg viewBox="0 0 960 288" width="960" height="288">
<!--
  blocks      Gator blue 456×288 bled off the top, right and bottom (the masthead and stage ground, the biggest) · hub 232×104 (the hub tint under Latest) · chip 112×40 (a chip) · orange-ink 96×40 (the Join button), together ≈ 55% of 960×288
  arrangement the front page's own stack: a stage slab of blue on the right, a ruled hub block hung from the top of it, the wordmark set bottom-left on paper, bottoms and tops on space-24 steps, one space-24 gutter
  pattern     the stage board's dot screen: 6px-pitch dots (radial-gradient 1px) across the blue slab, plus one 4px orange foot rule under the blue like the board's border-4, and four rule hairlines in the hub block (the Latest list)
  scales      sides on space-8/space-24 steps; gutter space-24; corners radius-0; rule weights border-1, border-4
-->
<defs><pattern id="dots" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.16"/></pattern></defs>
<rect class="blue sq" x="504" y="0" width="456" height="284"/>
<rect x="504" y="0" width="456" height="284" fill="url(#dots)"/>
<rect class="orange sq" x="504" y="284" width="456" height="4"/>
<rect class="hub sq" x="528" y="24" width="232" height="104"/>
<rect class="rule sq" x="544" y="56" width="200" height="1"/>
<rect class="rule sq" x="544" y="72" width="200" height="1"/>
<rect class="rule sq" x="544" y="88" width="200" height="1"/>
<rect class="rule sq" x="544" y="104" width="200" height="1"/>
<rect class="blue sq" x="544" y="40" width="64" height="8"/>
<rect class="chip sq" x="784" y="24" width="112" height="40"/>
<rect class="oink sq" x="784" y="80" width="96" height="40"/>
</svg>
</div>
<div class="words"><h1 class="name">Gator<span>Bait</span> Media</h1><p class="tag">Design system · Gator Day</p></div>
</div>
</body>
</html>
