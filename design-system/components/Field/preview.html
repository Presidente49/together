<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Field · GatorBait Media</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin: 0; background: var(--paper); }
  .frame { padding: var(--space-24) var(--space-28); }
</style>
</head>
<body>
<div class="gb" style="background:var(--paper)">
  <form class="gb-form" onsubmit="return false">
    <div class="gb-field"><label for="f-name">Name</label><input id="f-name" type="text" value="Brenden Martin"></div>
    <div class="gb-field"><label for="f-msg">Message</label><textarea id="f-msg">Is the Magazine included with the annual plan?</textarea></div>
    <button class="gb-button gb-button--block" type="submit">Send message</button>
  </form>
</div>
</body>
</html>
