<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PlanCard · GatorBait Media</title>
<link rel="stylesheet" href="../../tokens.css">
<link rel="stylesheet" href="../bundle.css">
<style>
  html, body { margin: 0; background: var(--paper); }
  .frame { padding: var(--space-24) var(--space-28); }
</style>
</head>
<body>
<div class="gb frame" style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-24);max-width:760px">
  <div class="gb-plan"><h3>Monthly</h3><p class="gb-plan__price">$9.99 <small>/ month</small></p><p>Every column, the Magazine and GatorBait TV. 7-day free trial.</p><a class="gb-button gb-button--block" href="#">Select</a></div>
  <div class="gb-plan"><span class="gb-plan__ribbon">Best value</span><h3>Annual</h3><p class="gb-plan__price">$99 <small>/ year</small></p><p>Every column, the Magazine and GatorBait TV. 7-day free trial.</p><a class="gb-button gb-button--block" href="#">Select</a></div>
</div>
</body>
</html>
